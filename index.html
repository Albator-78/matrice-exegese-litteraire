<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrice d'Interprétation Littéraire & Herméneutique</title>
  <style>
    :root {
      --papier: #f8f5ee;
      --encre: #231f20;
      --encre-douce: #5a524c;
      --accent: #7a2e22; /* Rouge carmin d'édition ancienne */
      --bordure: #dcd4c6;
      --fond-carte: #fffdf9;
    }

    body {
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", serif;
      background-color: var(--papier);
      color: var(--encre);
      line-height: 1.7;
      margin: 0;
      padding: 2rem 1rem;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--encre);
      padding-bottom: 1.2rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      margin: 0 0 0.4rem 0;
      text-transform: uppercase;
    }

    .sous-titre {
      font-style: italic;
      color: var(--encre-douce);
      margin: 0;
      font-size: 1.05rem;
    }

    .panneau-saisie {
      background: var(--fond-carte);
      border: 1px solid var(--bordure);
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    label {
      display: block;
      font-variant: small-caps;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 170px;
      padding: 1rem;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.6;
      border: 1px solid var(--bordure);
      background-color: #fff;
      color: var(--encre);
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .reglage-seuil {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
      color: var(--encre-douce);
    }

    input[type="number"] {
      width: 60px;
      padding: 0.35rem;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--bordure);
      text-align: center;
    }

    .boutons {
      display: flex;
      gap: 0.6rem;
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.6rem 1.3rem;
      cursor: pointer;
      border: 1px solid var(--accent);
      transition: all 0.2s ease;
    }

    .btn-principal {
      background-color: var(--accent);
      color: #fff;
    }

    .btn-principal:hover {
      background-color: #5c2118;
    }

    .btn-secondaire {
      background-color: transparent;
      color: var(--accent);
    }

    .btn-secondaire:hover {
      background-color: rgba(122, 46, 34, 0.08);
    }

    #zone-resultat {
      margin-top: 2rem;
      display: none;
    }

    .carte-glose {
      background: var(--fond-carte);
      border-left: 4px solid var(--accent);
      border-top: 1px solid var(--bordure);
      border-right: 1px solid var(--bordure);
      border-bottom: 1px solid var(--bordure);
      padding: 1.6rem;
      margin-bottom: 1.5rem;
    }

    .carte-glose h2 {
      margin-top: 0;
      font-size: 1.25rem;
      font-weight: normal;
      font-variant: small-caps;
      color: var(--accent);
      border-bottom: 1px solid var(--bordure);
      padding-bottom: 0.4rem;
    }

    .glose-contenu p {
      margin: 0.8rem 0;
    }

    .glose-contenu ul {
      margin: 0.4rem 0 1rem 1.2rem;
      padding: 0;
    }

    .bloc-prosodie {
      background: var(--fond-carte);
      border: 1px solid var(--bordure);
      padding: 1.2rem 1.6rem;
      font-size: 0.95rem;
    }

    .vers-ligne {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--bordure);
      padding: 0.35rem 0;
      gap: 1rem;
    }

    .vers-ligne:last-child {
      border-bottom: none;
    }

    .badge-metre {
      color: var(--accent);
      font-style: italic;
      white-space: nowrap;
    }

    details {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--encre-douce);
    }

    pre {
      background: #efeae0;
      padding: 1rem;
      overflow-x: auto;
      border: 1px solid var(--bordure);
    }
  </style>
</head>
<body>

<main>
  <header>
    <h1>Matrice d’Exégèse Littéraire</h1>
    <p class="sous-titre">Analyse rhétorique, topique, narrative et herméneutique fondée sur la tradition</p>
  </header>

  <section class="panneau-saisie">
    <label for="texte-source">Texte ou poème à soumettre à l’interprétation</label>
    <textarea id="texte-source" placeholder="Saisissez un poème, un récit ou un extrait littéraire...">Jadis sous le verger où brillait le soleil,
Nos cœurs goûtaient la paix d'un printemps éternel.
Aujourd'hui le tombeau, la cendre et la poussière,
Recouvrent de l'oubli notre ancienne lumière,
Et dans ma solitude où coulent tant de pleurs,
Le sablier du deuil consume nos douleurs.</textarea>

    <div class="controles">
      <div class="reglage-seuil">
        <label for="seuil-input" style="margin:0;">Seuil de résonance :</label>
        <input type="number" id="seuil-input" value="3" min="1" max="20" step="0.5">
      </div>

      <div class="boutons">
        <button type="button" class="btn-secondaire" id="btn-exemple-conte">Charger un conte initiatique</button>
        <button type="button" class="btn-principal" id="btn-analyser">Interpréter le texte</button>
      </div>
    </div>
  </section>

  <section id="zone-resultat">
    <div class="carte-glose">
      <h2>Commentaire Exégétique</h2>
      <div id="rendu-exegese" class="glose-contenu"></div>
    </div>

    <div id="carte-prosodie" class="bloc-prosodie" style="display:none;">
      <strong style="color: var(--accent); font-variant: small-caps;">Scansion & Métrique :</strong>
      <div id="liste-vers" style="margin-top: 0.6rem;"></div>
    </div>

    <details>
      <summary>Consulter les données brutes de la matrice (JSON)</summary>
      <pre id="rendu-json"></pre>
    </details>
  </section>
</main>

<!-- Importation du moteur pur sans dépendance -->
<script src="src/ExegeseMoteur.js"></script>

<script>
  const btnAnalyser = document.getElementById("btn-analyser");
  const btnExempleConte = document.getElementById("btn-exemple-conte");
  const champTexte = document.getElementById("texte-source");
  const champSeuil = document.getElementById("seuil-input");
  const zoneResultat = document.getElementById("zone-resultat");
  const renduExegese = document.getElementById("rendu-exegese");
  const carteProsodie = document.getElementById("carte-prosodie");
  const listeVers = document.getElementById("liste-vers");
  const renduJson = document.getElementById("rendu-json");

  // Conversion légère du texte structuré du moteur en paragraphes HTML lisibles
  function formaterGloseHTML(texteBrut) {
    return texteBrut
      .split("\n\n")
      .map(bloc => {
        if (bloc.includes("\n  * ") || bloc.includes("\n- ")) {
          const lignes = bloc.split("\n");
          const titre = lignes[0].replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
          const items = lignes.slice(1).map(l => {
            const propre = l.replace(/^(\s*\*|-)\s*/, "")
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\*(.*?)\*/g, "<em>$1</em>");
            return `<li>${propre}</li>`;
          }).join("");
          return `<p>${titre}</p><ul>${items}</ul>`;
        }
        const pFormate = bloc
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.*?)\*/g, "<em>$1</em>");
        return `<p>${pFormate}</p>`;
      })
      .join("");
  }

  function lancerAnalyse() {
    const texte = champTexte.value.trim();
    if (!texte) return;

    const seuil = parseFloat(champSeuil.value) || 3;
    const moteur = new ExegeseMoteur({ seuilValidation: seuil });
    const resultat = moteur.interpreter(texte);

    renduExegese.innerHTML = formaterGloseHTML(resultat.exegese);
    renduJson.textContent = JSON.stringify(resultat.matrice, null, 2);

    // Affichage de la prosodie si versifié
    if (resultat.matrice.prosodie && resultat.matrice.prosodie.estVersifie) {
      carteProsodie.style.display = "block";
      listeVers.innerHTML = resultat.matrice.prosodie.details
        .map(v => `
          <div class="vers-ligne">
            <span>${v.vers}</span>
            <span class="badge-metre">${v.syllabes} syll. — ${v.metre}</span>
          </div>
        `).join("");
    } else {
      carteProsodie.style.display = "none";
    }

    zoneResultat.style.display = "block";
  }

  btnAnalyser.addEventListener("click", lancerAnalyse);

  btnExempleConte.addEventListener("click", () => {
    champTexte.value = `Chassé par un injuste exil loin de la maison paternelle, le jeune prince franchit le seuil de la forêt obscure pour entamer son errance.\nAu fond du gouffre, un vieillard lui remit une épée et lui révéla l'énigme du labyrinthe.\nAprès un rude combat contre le dragon, le héros retrouva son royaume et sa couronne.\nMais derrière le voile de cette victoire, c'est le mystère de la conscience et la quête de l'éternité divine qui s'accomplissent dans l'âme humaine.`;
    lancerAnalyse();
  });

  // Exécution initiale au chargement de la page
  lancerAnalyse();
</script>

</body>
</html>
